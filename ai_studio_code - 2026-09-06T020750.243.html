<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>兌幣機管理</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* iOS 系統字體與原生觸控體驗優化 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang TC", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #F2F2F7; /* iOS 預設背景色 */
    }
    .ios-blur {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .tap-effect:active {
      transform: scale(0.97);
      transition: transform 0.1s ease;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-[#1C1C1E] min-h-screen flex flex-col justify-between select-none">

  <!-- 頂部 iOS 導航列 (含毛玻璃模糊效果與分頁切換) -->
  <header class="sticky top-0 z-50 bg-[#F2F2F7]/80 ios-blur border-b border-gray-200/60 pt-safe">
    <div class="max-w-md mx-auto px-5 py-3 flex justify-between items-center">
      <div>
        <span class="text-[11px] font-semibold tracking-wider text-gray-500 uppercase">Claw Machine</span>
        <h1 class="text-xl font-bold text-black tracking-tight flex items-center gap-1.5" id="headerTitle">
          兌幣機管理
        </h1>
      </div>
      <div class="flex items-center gap-2">
        <!-- 分頁切換按鈕 -->
        <div class="bg-gray-200/80 p-0.5 rounded-xl flex text-xs font-semibold">
          <button onclick="switchTab('manage')" id="tabManageBtn" class="px-3 py-1.5 rounded-lg bg-white text-[#007AFF] shadow-sm transition">管理</button>
          <button onclick="switchTab('chart')" id="tabChartBtn" class="px-3 py-1.5 rounded-lg text-gray-600 transition">圖表</button>
        </div>
        <button onclick="fetchData()" class="w-8 h-8 rounded-full bg-gray-200/70 text-[#007AFF] flex items-center justify-center tap-effect text-sm">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-md mx-auto w-full px-4 pt-3 pb-8 space-y-5 flex-1">

    <!-- ==================== 分頁一：管理登記頁面 ==================== -->
    <div id="tabManageContent" class="space-y-5">
      
      <!-- 幣量低於 10,000 警告橫幅 (預設隱藏) -->
      <div id="coinWarningAlert" class="bg-red-50 border border-red-200 rounded-2xl p-4 flex items-center gap-3 hidden animate-pulse">
        <div class="w-10 h-10 rounded-full bg-red-500 text-white flex items-center justify-center text-lg font-bold shrink-0">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div>
          <div class="text-xs font-bold text-red-800">⚠️ 機台幣量嚴重不足警告！</div>
          <div class="text-xs text-red-600 mt-0.5">目前剩餘硬幣低於 $10,000，請盡快前往補幣！</div>
        </div>
      </div>

      <!-- 儀表板卡片 (iOS Widget 風格) -->
      <div class="grid grid-cols-2 gap-3">
        <!-- 剩餘 10 元硬幣 -->
        <div class="bg-white rounded-2xl p-4 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-gray-100 flex flex-col justify-between">
          <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded-full bg-[#007AFF]/10 text-[#007AFF] flex items-center justify-center text-xs">
              <i class="fa-solid fa-coins"></i>
            </div>
            <span class="text-xs font-medium text-gray-500">機台剩餘硬幣</span>
          </div>
          <div class="my-2">
            <div class="text-2xl font-bold text-gray-900 tracking-tight" id="currentCoins">$ 25,000</div>
            <div class="text-[11px] text-gray-400 font-medium mt-0.5" id="coinCount">約 2,500 枚 10元</div>
          </div>
          <div class="text-[10px] text-gray-400 bg-gray-50 py-1 px-2 rounded-md inline-block self-start font-medium">初始底池 $25,000 (9/4)</div>
        </div>

        <!-- 累計營收 (收回鈔票) -->
        <div class="bg-white rounded-2xl p-4 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-gray-100 flex flex-col justify-between">
          <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded-full bg-[#34C759]/10 text-[#34C759] flex items-center justify-center text-xs">
              <i class="fa-solid fa-money-bill-wave"></i>
            </div>
            <span class="text-xs font-medium text-gray-500">累計取走鈔票</span>
          </div>
          <div class="my-2">
            <div class="text-2xl font-bold text-[#34C759] tracking-tight" id="totalCashTaken">$ 0</div>
            <div class="text-[11px] text-gray-400 font-medium mt-0.5" id="totalCoinsAdded">補幣累計: $0</div>
          </div>
          <div class="text-[10px] text-[#34C759] bg-green-50 py-1 px-2 rounded-md inline-block self-start font-medium">歷史總營收</div>
        </div>
      </div>

      <!-- 柏昇交接給奕昕的欠款狀態卡片 -->
      <div id="debtCard" class="bg-amber-50 border border-amber-200 rounded-2xl p-4 flex items-center justify-between hidden">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-amber-500 text-white flex items-center justify-center text-lg font-bold">
            <i class="fa-solid fa-hand-holding-dollar"></i>
          </div>
          <div>
            <div class="text-xs font-semibold text-amber-800">柏昇未交接現金（欠款）</div>
            <div class="text-xl font-bold text-amber-900" id="pendingDebtAmount">$ 0</div>
          </div>
        </div>
        <button onclick="openSettleModal()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold px-3.5 py-2 rounded-xl tap-effect shadow-sm">
          奕昕確認收回
        </button>
      </div>

      <!-- 每日清機登記表單 -->
      <div>
        <div class="flex justify-between items-center px-3 mb-1.5">
          <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider" id="formTitle">每日抄表與補幣</div>
          <button id="cancelEditBtn" onclick="cancelEdit()" class="text-xs text-red-500 font-medium hidden tap-effect">取消編輯</button>
        </div>
        
        <form id="recordForm" class="bg-white rounded-2xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-gray-100 divide-y divide-gray-100 overflow-hidden">
          <input type="hidden" id="editingId" value="">
          
          <!-- 處理人員 -->
          <div class="flex items-center justify-between px-4 py-3">
            <label class="text-sm font-medium text-gray-800 w-28">處理人員</label>
            <div class="flex gap-2">
              <label class="cursor-pointer text-sm font-medium px-3 py-1 rounded-lg border border-gray-200 transition select-none flex items-center gap-1.5 bg-gray-50 text-gray-700 has-[:checked]:bg-[#007AFF]/10 has-[:checked]:text-[#007AFF] has-[:checked]:border-[#007AFF]">
                <input type="radio" name="operator" value="柏昇" class="hidden" checked> 柏昇
              </label>
              <label class="cursor-pointer text-sm font-medium px-3 py-1 rounded-lg border border-gray-200 transition select-none flex items-center gap-1.5 bg-gray-50 text-gray-700 has-[:checked]:bg-[#007AFF]/10 has-[:checked]:text-[#007AFF] has-[:checked]:border-[#007AFF]">
                <input type="radio" name="operator" value="奕昕" class="hidden"> 奕昕
              </label>
            </div>
          </div>

          <!-- 交易性質 -->
          <div class="flex items-center justify-between px-4 py-3">
            <label class="text-sm font-medium text-gray-800 w-28">交易性質</label>
            <div class="flex gap-2">
              <label class="cursor-pointer text-xs font-medium px-2.5 py-1.5 rounded-lg border border-gray-200 transition select-none flex items-center gap-1 bg-gray-50 text-gray-700 has-[:checked]:bg-blue-50 has-[:checked]:text-[#007AFF] has-[:checked]:border-[#007AFF]">
                <input type="radio" name="txType" value="normal" class="hidden" checked> 一般取鈔交接
              </label>
              <label class="cursor-pointer text-xs font-medium px-2.5 py-1.5 rounded-lg border border-gray-200 transition select-none flex items-center gap-1 bg-gray-50 text-gray-700 has-[:checked]:bg-purple-50 has-[:checked]:text-purple-600 has-[:checked]:border-purple-300">
                <input type="radio" name="txType" value="exchange" class="hidden"> 台主換幣 (不需交給奕昕)
              </label>
            </div>
          </div>

          <!-- 抄表日期與時間 -->
          <div class="flex items-center justify-between px-4 py-3">
            <label class="text-sm font-medium text-gray-800 w-28">抄表日期時間</label>
            <div class="flex items-center gap-2">
              <input type="date" id="recordDate" class="text-sm text-right bg-transparent outline-none text-[#007AFF] font-medium" required>
              <input type="time" id="recordTime" class="text-sm text-right bg-transparent outline-none text-gray-600 font-medium" required>
            </div>
          </div>

          <!-- 拿走鈔票 -->
          <div class="px-4 py-3 space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-sm font-medium text-gray-800 w-32">拿走鈔票 ($)</label>
              <input type="number" id="cashTaken" inputmode="numeric" placeholder="沒填則為 0" class="text-sm text-right bg-transparent outline-none flex-1 font-semibold text-gray-900 placeholder:text-gray-300">
            </div>
            <div class="flex gap-1.5 justify-end pt-1">
              <button type="button" onclick="addAmount('cashTaken', 1000)" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 rounded-md tap-effect font-medium">+1,000</button>
              <button type="button" onclick="addAmount('cashTaken', 3000)" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 rounded-md tap-effect font-medium">+3,000</button>
              <button type="button" onclick="addAmount('cashTaken', 5000)" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 rounded-md tap-effect font-medium">+5,000</button>
              <button type="button" onclick="addAmount('cashTaken', 10000)" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 rounded-md tap-effect font-medium">+10,000</button>
            </div>
          </div>

          <!-- 補進10元 -->
          <div class="px-4 py-3 space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-sm font-medium text-gray-800 w-32">補進 10元 ($)</label>
              <input type="number" id="coinsAdded" inputmode="numeric" placeholder="沒填則為 0" class="text-sm text-right bg-transparent outline-none flex-1 font-semibold text-[#007AFF] placeholder:text-gray-300">
            </div>
            <div class="flex gap-1.5 justify-end pt-1">
              <button type="button" onclick="addAmount('coinsAdded', 1000)" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 rounded-md tap-effect font-medium">+1,000</button>
              <button type="button" onclick="addAmount('coinsAdded', 3000)" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 rounded-md tap-effect font-medium">+3,000</button>
              <button type="button" onclick="addAmount('coinsAdded', 5000)" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 rounded-md tap-effect font-medium">+5,000</button>
              <button type="button" onclick="addAmount('coinsAdded', 10000)" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 rounded-md tap-effect font-medium">+10,000</button>
            </div>
          </div>

          <!-- 備註 -->
          <div class="flex items-center justify-between px-4 py-3">
            <label class="text-sm font-medium text-gray-800 w-24">備註</label>
            <input type="text" id="notes" placeholder="選填 (如：補滿鈔箱)" class="text-sm text-right bg-transparent outline-none flex-1 text-gray-600 placeholder:text-gray-300">
          </div>

          <!-- 提交按鈕 -->
          <div class="p-3 bg-white">
            <button type="submit" id="submitBtn" class="w-full bg-[#007AFF] text-white py-3 rounded-xl font-semibold text-sm shadow-sm tap-effect flex items-center justify-center gap-2">
              <i class="fa-solid fa-check"></i>
              儲存今日紀錄
            </button>
          </div>
        </form>
      </div>

      <!-- 歷史明細列表 -->
      <div>
        <div class="text-xs font-semibold text-gray-500 uppercase px-3 mb-1.5 tracking-wider">最近抄表紀錄</div>
        <div class="bg-white rounded-2xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-gray-100 overflow-hidden divide-y divide-gray-100" id="historyList">
          <div class="p-6 text-center text-xs text-gray-400">載入中...</div>
        </div>
      </div>
    </div>


    <!-- ==================== 分頁二：營收圖表分析頁面 ==================== -->
    <div id="tabChartContent" class="space-y-5 hidden">
      
      <!-- 月份選擇卡片 -->
      <div class="bg-white rounded-2xl p-4 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-gray-100 flex items-center justify-between">
        <span class="text-sm font-bold text-gray-800">選擇統計月份</span>
        <input type="month" id="chartMonthSelect" onchange="renderChart()" class="bg-gray-50 text-sm font-semibold text-[#007AFF] border border-gray-200 rounded-xl px-3 py-1.5 outline-none">
      </div>

      <!-- 月份統計摘要卡片 -->
      <div class="grid grid-cols-3 gap-2">
        <div class="bg-white rounded-2xl p-3 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-gray-100 text-center flex flex-col justify-between">
          <div class="text-[11px] text-gray-400 font-medium">總取鈔</div>
          <div class="text-sm font-bold text-[#34C759] my-1" id="monthTotalCash">$0</div>
          <div class="text-[9px] text-gray-400">鈔票營收</div>
        </div>
        <div class="bg-white rounded-2xl p-3 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-gray-100 text-center flex flex-col justify-between">
          <div class="text-[11px] text-gray-400 font-medium">總補幣</div>
          <div class="text-sm font-bold text-[#007AFF] my-1" id="monthTotalCoins">$0</div>
          <div class="text-[9px] text-gray-400">硬幣投入</div>
        </div>
        <div class="bg-white rounded-2xl p-3 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-gray-100 text-center flex flex-col justify-between">
          <div class="text-[11px] text-gray-400 font-medium">平均補幣頻率</div>
          <div class="text-sm font-bold text-purple-600 my-1" id="avgRefillDays">-- 天</div>
          <div class="text-[9px] text-gray-400">每幾天補一次</div>
        </div>
      </div>

      <!-- 圖表顯示卡片 -->
      <div class="bg-white rounded-2xl p-5 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-gray-100 space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="text-sm font-bold text-gray-800">每日硬幣消耗量趨勢圖</h3>
          <div class="flex items-center gap-3 text-[11px] font-medium text-gray-500">
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span> 當日消耗幣量 ($)</span>
          </div>
        </div>

        <!-- 直條圖容器 -->
        <div class="overflow-x-auto no-scrollbar pt-4 pb-2">
          <div id="chartBarsContainer" class="flex items-end gap-3 min-w-full h-48 px-2 border-b border-gray-200">
            <div class="w-full text-center text-xs text-gray-400 self-center">載入圖表中...</div>
          </div>
        </div>
      </div>

      <!-- 該月每日明細列表 -->
      <div class="bg-white rounded-2xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-gray-100 overflow-hidden divide-y divide-gray-100" id="chartDetailList">
        <div class="p-4 text-center text-xs text-gray-400">尚無資料</div>
      </div>

    </div>

  </main>

  <!-- 奕昕確認收回對話框 (Modal) -->
  <div id="settleModal" class="fixed inset-0 z-50 bg-black/40 ios-blur flex items-center justify-center px-4 hidden">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl">
      <h3 class="text-base font-bold text-gray-900">確認收回現金交接</h3>
      <p class="text-xs text-gray-500">請選擇奕昕實際收到款項的日期與時間：</p>
      
      <div class="space-y-3">
        <div>
          <label class="text-xs font-medium text-gray-600 block mb-1">回收日期</label>
          <input type="date" id="settleDate" class="w-full text-sm bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 outline-none text-[#007AFF] font-medium">
        </div>
        <div>
          <label class="text-xs font-medium text-gray-600 block mb-1">回收時間</label>
          <input type="time" id="settleTime" class="w-full text-sm bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 outline-none text-gray-700 font-medium">
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button type="button" onclick="closeSettleModal()" class="flex-1 bg-gray-100 text-gray-700 py-2.5 rounded-xl text-xs font-semibold tap-effect">取消</button>
        <button type="button" onclick="confirmSettle()" class="flex-1 bg-amber-600 text-white py-2.5 rounded-xl text-xs font-semibold tap-effect shadow-sm">確認完成收回</button>
      </div>
    </div>
  </div>

  <!-- Firebase 模組 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, limit, serverTimestamp, updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD9oJirgoJCTU7h-ODfSpfwC80E5fqze2A",
      authDomain: "clawone-6445c.firebaseapp.com",
      projectId: "clawone-6445c",
      storageBucket: "clawone-6445c.firebasestorage.app",
      messagingSenderId: "945236029933",
      appId: "1:945236029933:web:f93ffb9e6f8b41aebd37e4",
      measurementId: "G-JEB18KRCXS"
    };

    const INITIAL_FLOAT = 25000; 
    const BASE_DATE = "2026-09-04"; // 設為基準日 9/4 號初始底池 $25,000
    const COLLECTION_NAME = "claw_coin_records"; 

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let unSettledRecords = [];
    window.allRecordsData = {};
    let globalRecordsList = [];

    const now = new Date();
    const todayStr = now.toISOString().split('T')[0];
    document.getElementById('recordDate').value = todayStr;
    document.getElementById('recordTime').value = now.toTimeString().substring(0, 5);
    document.getElementById('chartMonthSelect').value = todayStr.substring(0, 7);

    window.switchTab = function(tabName) {
      const manageContent = document.getElementById('tabManageContent');
      const chartContent = document.getElementById('tabChartContent');
      const manageBtn = document.getElementById('tabManageBtn');
      const chartBtn = document.getElementById('tabChartBtn');
      const headerTitle = document.getElementById('headerTitle');

      if (tabName === 'manage') {
        manageContent.classList.remove('hidden');
        chartContent.classList.add('hidden');
        manageBtn.className = "px-3 py-1.5 rounded-lg bg-white text-[#007AFF] shadow-sm transition";
        chartBtn.className = "px-3 py-1.5 rounded-lg text-gray-600 transition";
        headerTitle.innerText = "兌幣機管理";
      } else {
        manageContent.classList.add('hidden');
        chartContent.classList.remove('hidden');
        chartBtn.className = "px-3 py-1.5 rounded-lg bg-white text-[#007AFF] shadow-sm transition";
        manageBtn.className = "px-3 py-1.5 rounded-lg text-gray-600 transition";
        headerTitle.innerText = "營收圖表分析";
        renderChart();
      }
    };

    window.addAmount = function(elementId, amount) {
      const input = document.getElementById(elementId);
      const currentVal = Number(input.value) || 0;
      input.value = currentVal + amount;
    };

    async function fetchData() {
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '<div class="p-6 text-center text-xs text-gray-400">正在同步雲端資料...</div>';

      try {
        const q = query(collection(db, COLLECTION_NAME), orderBy("createdAt", "desc"), limit(100));
        const querySnapshot = await getDocs(q);

        let totalCashTaken = 0;
        let totalCoinsAdded = 0;
        let pendingDebt = 0;
        unSettledRecords = [];
        window.allRecordsData = {};
        globalRecordsList = [];
        let html = '';

        if (querySnapshot.empty) {
          historyList.innerHTML = '<div class="p-6 text-center text-xs text-gray-400">尚無抄表紀錄</div>';
        } else {
          querySnapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const id = docSnap.id;
            window.allRecordsData[id] = data;
            globalRecordsList.push({ id, ...data });

            const cash = Number(data.cashTaken || 0);
            const coins = Number(data.coinsAdded || 0);
            const operator = data.operator || '未指定';
            const txType = data.txType || 'normal';
            const timeStr = data.time ? ` ${data.time}` : '';
            const isSettled = data.isSettled !== undefined ? data.isSettled : true; 

            totalCashTaken += cash;
            totalCoinsAdded += coins;

            if (operator === '柏昇' && txType === 'normal' && cash > 0 && !isSettled) {
              pendingDebt += cash;
              unSettledRecords.push(id);
            }

            let statusBadge = '';
            if (txType === 'exchange') {
              statusBadge = `<span class="text-[10px] text-purple-700 bg-purple-50 px-1.5 py-0.5 rounded font-medium">台主換幣</span>`;
            } else if (operator === '柏昇' && cash > 0) {
              if (isSettled) {
                const settleInfo = data.settleTime ? ` (${data.settleDate} ${data.settleTime} 已收回)` : ' (已收回)';
                statusBadge = `<span class="text-[10px] text-green-600 bg-green-50 px-1.5 py-0.5 rounded font-medium">奕昕已收回${settleInfo}</span>`;
              } else {
                statusBadge = `<span class="text-[10px] text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded font-medium">待奕昕收回</span>`;
              }
            }

            html += `
              <div class="px-4 py-3 flex items-center justify-between">
                <div>
                  <div class="text-sm font-semibold text-gray-900 flex items-center gap-2 flex-wrap">
                    <span>${data.date}${timeStr}</span>
                    <span class="text-[11px] text-[#007AFF] bg-[#007AFF]/10 px-1.5 py-0.5 rounded font-medium">${operator}</span>
                    ${statusBadge}
                    ${data.notes ? `<span class="text-[10px] text-gray-500 font-normal bg-gray-100 px-1.5 py-0.5 rounded">${data.notes}</span>` : ''}
                  </div>
                  <div class="text-xs text-gray-400 mt-1 flex gap-3">
                    <span class="text-[#34C759] font-medium">取鈔: +$${cash.toLocaleString()}</span>
                    <span class="text-[#007AFF] font-medium">補幣: +$${coins.toLocaleString()}</span>
                  </div>
                </div>
                <div class="flex items-center gap-1">
                  <button onclick="editRecord('${id}')" class="text-gray-400 hover:text-[#007AFF] p-2 text-xs tap-effect" title="編輯紀錄">
                    <i class="fa-regular fa-pen-to-square"></i>
                  </button>
                  <button onclick="deleteRecord('${id}')" class="text-gray-300 hover:text-red-500 p-2 text-xs tap-effect" title="刪除紀錄">
                    <i class="fa-regular fa-trash-can"></i>
                  </button>
                </div>
              </div>
            `;
          });
          historyList.innerHTML = html;
        }

        const debtCard = document.getElementById('debtCard');
        if (pendingDebt > 0) {
          debtCard.classList.remove('hidden');
          document.getElementById('pendingDebtAmount').innerText = `$ ${pendingDebt.toLocaleString()}`;
        } else {
          debtCard.classList.add('hidden');
        }

        const remainingCoins = INITIAL_FLOAT - totalCashTaken + totalCoinsAdded;

        document.getElementById('currentCoins').innerText = `$ ${remainingCoins.toLocaleString()}`;
        document.getElementById('coinCount').innerText = `約 ${(remainingCoins / 10).toLocaleString()} 枚 10元`;
        document.getElementById('totalCashTaken').innerText = `$ ${totalCashTaken.toLocaleString()}`;
        document.getElementById('totalCoinsAdded').innerText = `補幣累計: $${totalCoinsAdded.toLocaleString()}`;

        const warningAlert = document.getElementById('coinWarningAlert');
        if (remainingCoins < 10000) {
          warningAlert.classList.remove('hidden');
        } else {
          warningAlert.classList.add('hidden');
        }

        renderChart();

      } catch (error) {
        console.error("讀取失敗:", error);
        historyList.innerHTML = '<div class="p-6 text-center text-xs text-red-500">載入失敗，請確認 Firestore 權限規則設定！</div>';
      }
    }

    // 計算每日硬幣消耗量的圖表邏輯
    window.renderChart = function() {
      const selectedMonth = document.getElementById('chartMonthSelect').value; 
      if (!selectedMonth) return;

      // 拷貝一份並由舊到新排序
      let sortedAll = [...globalRecordsList].sort((a, b) => a.date.localeCompare(b.date));

      let monthTotalCash = 0;
      let monthTotalCoins = 0;

      // 依日期整理
      let dailyMap = {};
      sortedAll.forEach(item => {
        const d = item.date;
        if (!dailyMap[d]) {
          dailyMap[d] = { cash: 0, coins: 0, details: [] };
        }
        const cash = Number(item.cashTaken || 0);
        const coins = Number(item.coinsAdded || 0);
        dailyMap[d].cash += cash;
        dailyMap[d].coins += coins;
        dailyMap[d].details.push(item);
      });

      // 計算從基準日 (9/4) 開始每天的硬幣餘額與每日消耗量
      let runningCoins = INITIAL_FLOAT;
      let currentDateObj = new Date(BASE_DATE);
      let todayObj = new Date(todayStr);

      let dailyConsumption = {}; // 紀錄每一天玩家用掉的幣量

      // 迴圈從 9/4 跑到今天
      while (currentDateObj <= todayObj) {
        let dStr = currentDateObj.toISOString().split('T')[0];
        
        let dayCash = dailyMap[dStr] ? dailyMap[dStr].cash : 0;
        let dayCoins = dailyMap[dStr] ? dailyMap[dStr].coins : 0;

        // 當天結束時的剩餘硬幣 = 昨天結餘 + 當天補幣 - 當天拿走鈔票
        // (因為拿走鈔票通常等於當天換出的硬幣金額，或者是直接以硬幣減少量來算)
        // 這裡以「拿走鈔票金額 = 當天玩家換走的硬幣價值」來計算實際消耗量
        let consumed = dayCash; 

        if (dStr.startsWith(selectedMonth)) {
          dailyConsumption[dStr] = {
            consumed: consumed,
            coinsAdded: dayCoins,
            cashTaken: dayCash
          };
          monthTotalCash += dayCash;
          monthTotalCoins += dayCoins;
        }

        currentDateObj.setDate(currentDateObj.getDate() + 1);
      }

      // 計算平均幾天補一次幣
      const uniqueRefillDays = Object.keys(dailyMap).filter(d => d.startsWith(selectedMonth) && dailyMap[d].coins > 0);
      let avgDaysText = "無資料";
      if (uniqueRefillDays.length > 1) {
        const daysInMonth = new Date(selectedMonth.substring(0, 4), selectedMonth.substring(5, 7), 0).getDate();
        const avg = (daysInMonth / uniqueRefillDays.length).toFixed(1);
        avgDaysText = `約 ${avg} 天`;
      } else if (uniqueRefillDays.length === 1) {
        avgDaysText = `共 1 次`;
      }

      document.getElementById('monthTotalCash').innerText = `$${monthTotalCash.toLocaleString()}`;
      document.getElementById('monthTotalCoins').innerText = `$${monthTotalCoins.toLocaleString()}`;
      document.getElementById('avgRefillDays').innerText = avgDaysText;

      const container = document.getElementById('chartBarsContainer');
      const detailList = document.getElementById('chartDetailList');

      const chartDates = Object.keys(dailyConsumption).sort();
      if (chartDates.length === 0) {
        container.innerHTML = '<div class="w-full text-center text-xs text-gray-400 self-center">該月份尚無資料</div>';
        detailList.innerHTML = '<div class="p-4 text-center text-xs text-gray-400">尚無明細資料</div>';
        return;
      }

      let maxVal = 1000;
      chartDates.forEach(d => {
        if (dailyConsumption[d].consumed > maxVal) maxVal = dailyConsumption[d].consumed;
      });

      let barsHtml = '';
      let detailHtml = '';

      chartDates.forEach(d => {
        const data = dailyConsumption[d];
        const height = Math.round((data.consumed / maxVal) * 120);
        const dayLabel = d.substring(8); 

        barsHtml += `
          <div class="flex flex-col items-center h-full justify-end flex-1 min-w-[32px] group">
            <div class="flex items-end gap-1 w-full justify-center h-[130px]">
              <div class="w-4 bg-amber-500 rounded-t transition-all duration-300" style="height: ${height}px;" title="消耗: $${data.consumed}"></div>
            </div>
            <div class="text-[10px] text-gray-500 font-medium mt-1">${dayLabel}日</div>
          </div>
        `;

        detailHtml += `
          <div class="p-3.5 flex items-center justify-between">
            <div>
              <div class="text-sm font-semibold text-gray-900">${d}</div>
              <div class="text-xs text-gray-400 mt-0.5 flex gap-3">
                <span class="text-amber-600 font-medium">當日消耗幣量: $${data.consumed.toLocaleString()}</span>
                ${data.coinsAdded > 0 ? `<span class="text-[#007AFF] font-medium">補幣: +$${data.coinsAdded.toLocaleString()}</span>` : ''}
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = barsHtml;
      detailList.innerHTML = detailHtml;
    };

    window.editRecord = function(id) {
      switchTab('manage'); 
      const data = window.allRecordsData[id];
      if (!data) return;

      document.getElementById('editingId').value = id;
      
      const radios = document.querySelectorAll('input[name="operator"]');
      radios.forEach(r => {
        if (r.value === data.operator) r.checked = true;
      });

      const txTypeRadios = document.querySelectorAll('input[name="txType"]');
      const currentTxType = data.txType || 'normal';
      txTypeRadios.forEach(r => {
        if (r.value === currentTxType) r.checked = true;
      });

      document.getElementById('recordDate').value = data.date || '';
      document.getElementById('recordTime').value = data.time || '';
      document.getElementById('cashTaken').value = data.cashTaken !== undefined && data.cashTaken !== 0 ? data.cashTaken : '';
      document.getElementById('coinsAdded').value = data.coinsAdded !== undefined && data.coinsAdded !== 0 ? data.coinsAdded : '';
      document.getElementById('notes').value = data.notes || '';

      document.getElementById('formTitle').innerText = '編輯抄表紀錄';
      document.getElementById('formTitle').classList.add('text-[#007AFF]');
      document.getElementById('cancelEditBtn').classList.remove('hidden');
      document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-pen"></i> 確認修改儲存';
      document.getElementById('submitBtn').classList.replace('bg-[#007AFF]', 'bg-[#34C759]');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.cancelEdit = function() {
      document.getElementById('editingId').value = '';
      document.getElementById('formTitle').innerText = '每日抄表與補幣';
      document.getElementById('formTitle').classList.remove('text-[#007AFF]');
      document.getElementById('cancelEditBtn').classList.add('hidden');
      document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-check"></i> 儲存今日紀錄';
      document.getElementById('submitBtn').classList.replace('bg-[#34C759]', 'bg-[#007AFF]');

      document.getElementById('recordForm').reset();
      const freshNow = new Date();
      document.getElementById('recordDate').value = freshNow.toISOString().split('T')[0];
      document.getElementById('recordTime').value = freshNow.toTimeString().substring(0, 5);
    };

    window.openSettleModal = function() {
      const modalNow = new Date();
      document.getElementById('settleDate').value = modalNow.toISOString().split('T')[0];
      document.getElementById('settleTime').value = modalNow.toTimeString().substring(0, 5);
      document.getElementById('settleModal').classList.remove('hidden');
    };

    window.closeSettleModal = function() {
      document.getElementById('settleModal').classList.add('hidden');
    };

    window.confirmSettle = async function() {
      const settleDate = document.getElementById('settleDate').value;
      const settleTime = document.getElementById('settleTime').value;

      try {
        for (let id of unSettledRecords) {
          const docRef = doc(db, COLLECTION_NAME, id);
          await updateDoc(docRef, { 
            isSettled: true,
            settleDate: settleDate,
            settleTime: settleTime
          });
        }
        closeSettleModal();
        fetchData();
      } catch (error) {
        alert("結清失敗: " + error.message);
      }
    };

    document.getElementById('recordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const editingId = document.getElementById('editingId').value;
      const operator = document.querySelector('input[name="operator"]:checked').value;
      const txType = document.querySelector('input[name="txType"]:checked').value;
      const date = document.getElementById('recordDate').value;
      const time = document.getElementById('recordTime').value;
      
      const cashTakenVal = document.getElementById('cashTaken').value;
      const cashTaken = cashTakenVal === "" ? 0 : Number(cashTakenVal);

      const coinsAddedVal = document.getElementById('coinsAdded').value;
      const coinsAdded = coinsAddedVal === "" ? 0 : Number(coinsAddedVal);
      
      const notes = document.getElementById('notes').value.trim();

      try {
        const isSettled = (operator === '柏昇' && txType === 'normal' && cashTaken > 0) ? false : true;

        if (editingId) {
          const docRef = doc(db, COLLECTION_NAME, editingId);
          await updateDoc(docRef, {
            operator,
            txType,
            date,
            time,
            cashTaken,
            coinsAdded,
            notes,
            isSettled
          });

          cancelEdit();
        } else {
          await addDoc(collection(db, COLLECTION_NAME), {
            operator,
            txType,
            date,
            time,
            cashTaken,
            coinsAdded,
            notes,
            isSettled,
            createdAt: serverTimestamp()
          });

          document.getElementById('cashTaken').value = '';
          document.getElementById('coinsAdded').value = '';
          document.getElementById('notes').value = '';
        }
        
        const freshNow = new Date();
        document.getElementById('recordDate').value = freshNow.toISOString().split('T')[0];
        document.getElementById('recordTime').value = freshNow.toTimeString().substring(0, 5);

        fetchData();
      } catch (error) {
        alert("儲存失敗: " + error.message);
      }
    });

    window.deleteRecord = async function(id) {
      if (confirm("確定要刪除這筆抄表紀錄嗎？")) {
        try {
          await deleteDoc(doc(db, COLLECTION_NAME, id));
          fetchData();
        } catch (error) {
          alert("刪除失敗: " + error.message);
        }
      }
    };

    window.fetchData = fetchData;
    fetchData();
  </script>
</body>
</html>
